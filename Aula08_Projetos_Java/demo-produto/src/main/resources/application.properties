# Banco em memoria H2 (nenhuma instalacao necessaria no laboratorio)
spring.datasource.url=jdbc:h2:mem:loja
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Geracao automatica do esquema a partir das entidades mapeadas
spring.jpa.hibernate.ddl-auto=update

# Exibicao do SQL gerado pelo Hibernate (essencial em sala de aula)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
